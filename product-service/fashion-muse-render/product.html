<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DealDesi | Product</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background: #fff;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    /* Images */
    .images img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 15px;
      object-fit: cover;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 30px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    .tabs span.active {
      border-bottom: 2px solid #000;
      padding-bottom: 4px;
    }

    /* Title */
    h1 {
      font-size: 26px;
      margin: 15px 0 5px;
    }

    /* Rating */
    .rating {
      color: #ff9f00;
      font-size: 14px;
      margin-bottom: 10px;
    }

    /* Price */
    .price {
      margin: 10px 0;
    }

    .old-price {
      text-decoration: line-through;
      color: #999;
      margin-right: 10px;
    }

    .new-price {
      font-size: 22px;
      font-weight: 700;
    }

    .off {
      background: #ff3f3f;
      color: #fff;
      padding: 3px 8px;
      font-size: 12px;
      border-radius: 6px;
      margin-left: 10px;
    }

    /* Section */
    .section {
      margin-top: 20px;
    }

    .section h4 {
      margin-bottom: 8px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    /* Color boxes */
    .options {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .option {
      border: 1px solid #ccc;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .option.active {
      border: 2px solid #000;
    }

    /* Size */
    .size {
      width: 40px;
      text-align: center;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .add {
      background: #fff;
      border: 1px solid #000;
    }

    .buy {
      background: #000;
      color: #fff;
      border: none;
    }

    /* Stock */
    .stock {
      margin-top: 10px;
      color: green;
      font-size: 14px;
    }

    /* Description */
    .desc {
      margin-top: 20px;
      color: #555;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Images -->
  <div class="images" id="images"></div>

  <!-- Details -->
  <div>
    <div class="tabs">
      <span class="active">Women</span>
      <span>Men</span>
    </div>

    <h1 id="name"></h1>

    <div class="rating">★★★★★ <span id="reviews"></span> reviews</div>

    <div class="price">
      <span class="old-price" id="oldPrice"></span>
      <span class="new-price" id="price"></span>
      <span class="off">34% OFF</span>
    </div>

    <div class="section">
      <h4>COLOR</h4>
      <div class="options" id="colors"></div>
    </div>

    <div class="section">
      <h4>SIZE</h4>
      <div class="options" id="sizes"></div>
    </div>

    <div class="stock">● In stock, ready to ship</div>

    <button class="btn add">Add to cart</button>
    <button class="btn buy">Buy it now</button>

    <div class="desc" id="description"></div>
  </div>

</div>

<script>
const API = "http://localhost:3000/products";
const id = new URLSearchParams(window.location.search).get("id");

async function loadProduct() {
  const res = await fetch(`${API}/${id}`);
  const p = await res.json();

  document.getElementById("name").innerText = p.name;
  document.getElementById("price").innerText = `Rs. ${p.price}`;
  document.getElementById("oldPrice").innerText = `Rs. ${Math.round(p.price * 1.5)}`;
  document.getElementById("reviews").innerText = Math.floor(Math.random() * 200 + 50);
  document.getElementById("description").innerText = p.description || "";

  /* Images */
  let imgs = [];
  try {
    imgs = JSON.parse(p.image_url.replace(/'/g,'"'));
  } catch(e){}

  const imgBox = document.getElementById("images");
  imgs.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    imgBox.appendChild(img);
  });

  /* Colors */
  const colors = p.color?.split(",") || ["Black","White","Maroon"];
  const colorBox = document.getElementById("colors");
  colors.forEach((c,i)=>{
    const d = document.createElement("div");
    d.className = "option" + (i===0?" active":"");
    d.innerText = c.trim();
    colorBox.appendChild(d);
  });

  /* Sizes */
  const sizes = p.size?.split(",") || ["XS","S","M","L","XL"];
  const sizeBox = document.getElementById("sizes");
  sizes.forEach((s,i)=>{
    const d = document.createElement("div");
    d.className = "option size" + (i===0?" active":"");
    d.innerText = s.trim();
    sizeBox.appendChild(d);
  });
}

loadProduct();
</script>

</body>
</html>
